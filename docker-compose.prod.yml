services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Must be reachable from the *browser*, not from inside this
        # Docker network — the EC2 instance's public IP/domain, e.g.
        # http://1.2.3.4:4000, not http://api:4000.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env — the EC2 instance's public address}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    ports:
      - "4000:4000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}?schema=public
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # The browser's origin, not this Docker network's — same address
      # family as NEXT_PUBLIC_API_URL above, just without the port the
      # api itself listens on being relevant here.
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env — the EC2 instance's public address, port 3000}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Not published to the host: only the api container needs to
    # reach Postgres, over the internal Docker network. Publishing
    # 5432 on a public EC2 instance would expose the database directly
    # to the internet for no reason.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
